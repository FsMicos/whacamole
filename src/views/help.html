<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pégale al Topo - Ayuda</title>
    
    <!-- Fuentes y estilos globales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/ui-styles.css"> 
    <script src="/js/global-music-control.js"></script>

    <!-- Estilos específicos para la página de ayuda -->
    <style>
        /* Capa oscura semitransparente, como en la tabla de records */
        .help-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(20, 10, 0, 0.75);
            z-index: 1;
        }

        /* Contenedor para centrar el contenido vertical y horiazontalmente */
        .help-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* El panel principal con las instrucciones */
        .help-panel {
            width: 100%;
            max-width: 700px; /* Ancho máximo para el texto */
            padding: 2.5rem;
            margin-bottom: 3rem; /* Espacio entre el panel y el botón de volver */
            
            /* Colores tomados del botón de ayuda */
            background-color: #b9896e;
            border: 4px solid #4e342e;
            border-radius: 8px;
            box-shadow: 0 8px 0 #8a624a; /* Sombra un poco más grande */
            
            /* Estilos del texto */
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px; /* Tamaño de fuente legible */
            line-height: 1.8;  /* Espaciado entre líneas para mejor lectura */
            text-align: center;
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 600px) {
            .help-panel {
                padding: 1.5rem;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- La capa oscura que cubre el fondo original -->
    <div class="help-overlay"></div>

    <!-- El contenedor que centra el contenido -->
    <div class="help-container">
        
        <!-- El panel con el texto de ayuda -->
        <div class="help-panel">
            <p>
                Los jugadores deben golpear topos que aparecen aleatoriamente en agujeros en el suelo. El objetivo es golpear tantos topos como sea posible antes de que se acabe el tiempo, ganando puntos por cada golpe exitoso y mucho más si reaccionas rápido.
            </p>
        </div>

        <!-- Botón para volver al inicio, reutilizando estilos existentes -->
        <a href="/" class="ui-panel button-panel"><svg width="20" height="23" viewBox="0 0 20 23" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <g clip-path="url(#clip0_135_12)">
                    <path
                        d="M1.344 13.858L14.3255 22.3767C14.6886 22.6146 15.1039 22.7902 15.5478 22.8933C15.9917 22.9965 16.4555 23.0252 16.9126 22.9779C17.3698 22.9305 17.8113 22.808 18.212 22.6173C18.6128 22.4267 18.965 22.1716 19.2483 21.8667C19.8206 21.2509 20.0781 20.4694 19.9642 19.6941C19.8503 18.9189 19.3744 18.2134 18.6411 17.7328L9.14385 11.5047L18.6411 5.2725C19.0067 5.03614 19.3128 4.74112 19.5416 4.40462C19.7704 4.06809 19.9173 3.69675 19.9738 3.31216C20.0303 2.92757 19.9953 2.53739 19.8707 2.16426C19.7462 1.79114 19.5346 1.4425 19.2483 1.1386C18.9665 0.83184 18.6148 0.575148 18.2139 0.383408C17.813 0.191668 17.3707 0.0687067 16.9128 0.0216557C16.4548 -0.0253955 15.9903 0.004401 15.5462 0.109317C15.102 0.214233 14.6871 0.39218 14.3255 0.632829L1.34401 9.14726C0.92448 9.43049 0.58595 9.78913 0.353348 10.1968C0.120745 10.6044 4.8107e-08 11.0506 0 11.5027C-4.8107e-08 11.9547 0.120745 12.4009 0.353348 12.8086C0.58595 13.2162 0.92448 13.5748 1.344 13.858Z"
                        fill="#5A3E2B" />
                </g>
                <defs>
                    <clipPath id="clip0_135_12">
                        <rect width="20" height="23" fill="white" />
                    </clipPath>
                </defs>
            </svg>
            VOLVER</a>

    </div>
    <script>
        // Sistema de control global de música integrado
        if (!window.globalMusicControl) {
            class GlobalMusicControl {
                constructor() {
                    this.isMuted = localStorage.getItem('musicMuted') === 'true';
                    this.audioElements = [];
                }

                registerAudio(audioElement, volume = 1) {
                    audioElement.defaultVolume = volume;
                    this.audioElements.push(audioElement);
                    
                    if (this.isMuted) {
                        audioElement.volume = 0;
                    } else {
                        audioElement.volume = volume;
                    }
                }

                toggleMute() {
                    this.isMuted = !this.isMuted;
                    localStorage.setItem('musicMuted', this.isMuted.toString());
                    
                    this.audioElements.forEach(audio => {
                        if (this.isMuted) {
                            audio.volume = 0;
                        } else {
                            audio.volume = audio.defaultVolume || 1;
                        }
                    });
                    
                    this.updateButton();
                    
                    window.dispatchEvent(new CustomEvent('globalMuteToggled', { 
                        detail: { isMuted: this.isMuted } 
                    }));
                }

                updateButton() {
                    const button = document.getElementById('muteButton');
                    if (button) {
                        if (this.isMuted) {
                            button.textContent = '🔇';
                            button.classList.add('muted');
                        } else {
                            button.textContent = '🔊';
                            button.classList.remove('muted');
                        }
                    }
                }

                setupButton() {
                    const button = document.getElementById('muteButton');
                    if (button) {
                        this.updateButton();
                        button.addEventListener('click', () => this.toggleMute());
                    }
                    
                    // Event listener para tecla M
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'm' || e.key === 'M') {
                            this.toggleMute();
                        }
                    });
                }
            }

            window.globalMusicControl = new GlobalMusicControl();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Configurar el botón de silenciar
            window.globalMusicControl.setupButton();

            // Background music setup - MISMA MÚSICA QUE EN EL MENÚ PRINCIPAL
            const backgroundMusic = new Audio('/media/solitario.mp3');
            backgroundMusic.loop = true;
            backgroundMusic.preload = 'auto';
            
            // Registrar audio con el sistema global
            window.globalMusicControl.registerAudio(backgroundMusic, 0.8);

            // Variable de control para inicio de música
            let musicStarted = false;
            
            function startMusic() {
                if (!musicStarted) {
                    backgroundMusic.play().catch(error => {
                        console.log('Music playback failed:', error);
                    });
                    musicStarted = true;
                }
            }

            // Event listeners para iniciar música con interacción del usuario
            document.addEventListener('click', startMusic, { once: true });
            document.addEventListener('keydown', startMusic, { once: true });
            document.addEventListener('touchstart', startMusic, { once: true });
        });
    </script>
</body>
</html>
