<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pégale al Topo - Inicio</title>
  <!-- 1. Importar la fuente de Google Fonts -->

  <!-- 2. Enlazar el archivo CSS unificado -->
  <link rel="stylesheet" href="/css/ui-styles.css"> 
  <link rel="stylesheet" href="/css/help-style.css"> 
</head>
<body>
  <!-- 3. Usar el contenedor wrapper para centrar el contenido -->
  <div class="home-panel-wrapper">
      <!-- Título con estilos de ui-panel -->
      <div class="ui-panel title-panel">PEGALE AL TOPO</div>
      
      <!-- Botón de Jugar como un enlace con estilos de ui-panel -->
      <a href="/game" class="ui-panel button-panel"><svg width="30" height="28" viewBox="0 0 30 28" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <g clip-path="url(#clip0_123_41)">
            <path
              d="M27.8484 10.9538C30.7172 12.5163 30.7172 15.4851 27.8484 17.0476L9.32379 27.1371C5.56732 29.1831 -1.51279e-07 27.3638 0 24.0902L9.32554e-07 3.91117C1.08384e-06 0.637638 5.56732 -1.18167 9.32379 0.864303L27.8484 10.9538Z"
              fill="#5A3E2B" />
          </g>
          <defs>
            <clipPath id="clip0_123_41">
              <rect width="30" height="28" fill="white" />
            </clipPath>
          </defs>
        </svg>
        JUGAR</a>
      
      <!-- Botón de Records como un enlace con estilos de ui-panel -->
      <a href="/leaderboard" class="ui-panel button-panel"><svg width="21" height="23" viewBox="0 0 21 23" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <g clip-path="url(#clip0_135_8)">
            <path
              d="M9.06508 1.17079C9.51673 -0.390265 11.4833 -0.390264 11.935 1.17079L13.3793 6.16295C13.5813 6.8611 14.1606 7.33377 14.8142 7.33377H19.4883C20.9499 7.33377 21.5576 9.43416 20.3752 10.3989L16.5938 13.4843C16.0649 13.9157 15.8437 14.6805 16.0457 15.3786L17.49 20.3708C17.9417 21.9319 16.3507 23.23 15.1683 22.2652L11.3869 19.1799C10.858 18.7484 10.142 18.7484 9.61315 19.1799L5.83174 22.2652C4.64929 23.23 3.05832 21.9319 3.50997 20.3708L4.95434 15.3786C5.15633 14.6805 4.93507 13.9157 4.40623 13.4843L0.624834 10.3989C-0.557619 9.43416 0.0500828 7.33377 1.51167 7.33377H6.18577C6.83941 7.33377 7.41872 6.8611 7.62068 6.16295L9.06508 1.17079Z"
              fill="#5A3E2B" />
          </g>
          <defs>
            <clipPath id="clip0_135_8">
              <rect width="21" height="23" fill="white" />
            </clipPath>

        </svg>
        RECORDS</a>
  </div>
   <a href="/help" class="help-button">?</a>
   <button class="mute-button" id="muteButton">🔊</button>
   
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Background music setup
      const backgroundMusic = new Audio('/media/solitario.mp3');
      backgroundMusic.loop = true;
      backgroundMusic.preload = 'auto';
      backgroundMusic.volume = 0.3;

      // Try to play music when user interacts with the page (to comply with browser autoplay policies)
      let musicStarted = false;
      let isMuted = false;
      
      // Referencias al botón de silenciar
      const muteButton = document.getElementById('muteButton');
      
      function startMusic() {
        if (!musicStarted) {
          backgroundMusic.play().catch(error => {
            console.log('Music playback failed:', error);
          });
          musicStarted = true;
        }
      }

      // Función para alternar silencio
      function toggleMute() {
        if (isMuted) {
          backgroundMusic.volume = 0.3;
          muteButton.textContent = '🔊';
          muteButton.classList.remove('muted');
          isMuted = false;
        } else {
          backgroundMusic.volume = 0;
          muteButton.textContent = '🔇';
          muteButton.classList.add('muted');
          isMuted = true;
        }
      }

      // Event listener para el botón de silenciar
      muteButton.addEventListener('click', toggleMute);

      // Add event listeners for user interaction
      document.addEventListener('click', startMusic, { once: true });
      document.addEventListener('keydown', startMusic, { once: true });
      document.addEventListener('touchstart', startMusic, { once: true });

      // Optional: Add a mute/unmute button functionality with keyboard
      document.addEventListener('keydown', (e) => {
        if (e.key === 'm' || e.key === 'M') {
          toggleMute();
        }
      });
    });
   </script>
</body>
</html>
