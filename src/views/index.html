<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pégale al Topo - Inicio</title>
  <!-- 1. Importar la fuente de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- 2. Enlazar el archivo CSS unificado -->
  <link rel="stylesheet" href="/css/ui-styles.css"> 
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/help-style.css"> 
  <link rel="stylesheet" href="/css/mute-button.css">
</head>
<body>

  <div id="player-info-overlay">
    <div class="registration-form">
      <div class="registration-title">REGISTRO</div>
      
      <label class="form-label" for="player-name">Nombre (4 letras):</label>
      <input type="text" id="player-name" class="form-input" maxlength="4" placeholder="NICK">
      
      <label class="form-label" for="player-age">Edad:</label>
      <input type="number" id="player-age" class="form-input" min="1" max="120" placeholder="25">
      
      <button id="start-button" class="continue-button">CONTINUAR</button>
    </div>
  </div>
  <!-- 3. Usar el contenedor wrapper para centrar el contenido -->
  <div class="home-panel-wrapper">
      <!-- Título con estilos de ui-panel -->
      <div class="ui-panel title-panel">PEGALE AL TOPO</div>

      <div class="ui-panel player-info-panel" id="player-info" style="display: none;">
        Jugador: <span id="player-name-display"></span>
      </div>
      
      <!-- Botón de Jugar como un enlace con estilos de ui-panel -->
      <a href="/game" class="ui-panel button-panel"><svg width="30" height="28" viewBox="0 0 30 28" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <g clip-path="url(#clip0_123_41)">
            <path
              d="M27.8484 10.9538C30.7172 12.5163 30.7172 15.4851 27.8484 17.0476L9.32379 27.1371C5.56732 29.1831 -1.51279e-07 27.3638 0 24.0902L9.32554e-07 3.91117C1.08384e-06 0.637638 5.56732 -1.18167 9.32379 0.864303L27.8484 10.9538Z"
              fill="#5A3E2B" />
          </g>
          <defs>
            <clipPath id="clip0_123_41">
              <rect width="30" height="28" fill="white" />
            </clipPath>
          </defs>
        </svg>
        JUGAR</a>
      
      <!-- Botón de Records como un enlace con estilos de ui-panel -->
      <a href="/leaderboard" class="ui-panel button-panel"><svg width="21" height="23" viewBox="0 0 21 23" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <g clip-path="url(#clip0_135_8)">
            <path
              d="M9.06508 1.17079C9.51673 -0.390265 11.4833 -0.390264 11.935 1.17079L13.3793 6.16295C13.5813 6.8611 14.1606 7.33377 14.8142 7.33377H19.4883C20.9499 7.33377 21.5576 9.43416 20.3752 10.3989L16.5938 13.4843C16.0649 13.9157 15.8437 14.6805 16.0457 15.3786L17.49 20.3708C17.9417 21.9319 16.3507 23.23 15.1683 22.2652L11.3869 19.1799C10.858 18.7484 10.142 18.7484 9.61315 19.1799L5.83174 22.2652C4.64929 23.23 3.05832 21.9319 3.50997 20.3708L4.95434 15.3786C5.15633 14.6805 4.93507 13.9157 4.40623 13.4843L0.624834 10.3989C-0.557619 9.43416 0.0500828 7.33377 1.51167 7.33377H6.18577C6.83941 7.33377 7.41872 6.8611 7.62068 6.16295L9.06508 1.17079Z"
              fill="#5A3E2B" />
          </g>
          <defs>
            <clipPath id="clip0_135_8">
              <rect width="21" height="23" fill="white" />
            </clipPath>
          </defs>
        </svg>
        RECORDS</a>
  </div>
   <a href="/help" class="help-button">?</a>
   <button class="mute-button" id="muteButton">🔊</button>
   
   <script>
    // Sistema de control global de música integrado
    class GlobalMusicControl {
      constructor() {
        this.isMuted = localStorage.getItem('musicMuted') === 'true';
        this.audioElements = [];
        this.defaultVolume = 1;
      }

      registerAudio(audioElement, volume = 1) {
        audioElement.defaultVolume = volume;
        this.audioElements.push(audioElement);
        
        // Aplicar estado actual
        if (this.isMuted) {
          audioElement.volume = 0;
        } else {
          audioElement.volume = volume;
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        localStorage.setItem('musicMuted', this.isMuted.toString());
        
        // Actualizar todos los audios
        this.audioElements.forEach(audio => {
          if (this.isMuted) {
            audio.volume = 0;
          } else {
            audio.volume = audio.defaultVolume || 1;
          }
        });
        
        // Actualizar botón
        this.updateButton();
        
        // Notificar a otras páginas/scripts
        window.dispatchEvent(new CustomEvent('globalMuteToggled', { 
          detail: { isMuted: this.isMuted } 
        }));
      }

      updateButton() {
        const button = document.getElementById('muteButton');
        if (button) {
          if (this.isMuted) {
            button.textContent = '🔇';
            button.classList.add('muted');
          } else {
            button.textContent = '🔊';
            button.classList.remove('muted');
          }
        }
      }

      setupButton() {
        const button = document.getElementById('muteButton');
        if (button) {
          this.updateButton();
          button.addEventListener('click', () => this.toggleMute());
        }
      }
    }

    // Crear instancia global
    window.globalMusicControl = new GlobalMusicControl();

    document.addEventListener('DOMContentLoaded', () => {
      // Configurar el botón de silenciar
      window.globalMusicControl.setupButton();

      // Background music setup
      const backgroundMusic = new Audio('/media/solitario.mp3');
      backgroundMusic.loop = true;
      backgroundMusic.preload = 'auto';
      
      // Registrar audio con el sistema global
      window.globalMusicControl.registerAudio(backgroundMusic, 1);

      // Variable de control para inicio de música
      let musicStarted = false;
      
      function startMusic() {
        if (!musicStarted) {
          backgroundMusic.play().catch(error => {
            console.log('Music playback failed:', error);
          });
          musicStarted = true;
        }
      }

      // Event listeners para iniciar música con interacción del usuario
      document.addEventListener('click', startMusic, { once: true });
      document.addEventListener('keydown', startMusic, { once: true });
      document.addEventListener('touchstart', startMusic, { once: true });

      // Funcionalidad de tecla M
      document.addEventListener('keydown', (e) => {
        if (e.key === 'm' || e.key === 'M') {
          window.globalMusicControl.toggleMute();
        }
      });

      let playerRegistered = false;
      let playerData = {
        name: '',
        age: 0
      };

      // Referencias a elementos del DOM 
      const registrationOverlay = document.getElementById('player-info-overlay');
      const startRegistrationButton = document.getElementById('start-button');
      const playerNameInput = document.getElementById('player-name');
      const playerAgeInput = document.getElementById('player-age');
      const playerInfo = document.getElementById('player-info');
      const playerNameDisplay = document.getElementById('player-name-display');
      const playButton = document.querySelector('a[href="/game"]');

      if (!registrationOverlay || !startRegistrationButton || !playerNameInput || !playerAgeInput) {
        console.error('Error: No se pudieron encontrar todos los elementos del DOM necesarios');
        return;
      }

      // === LÓGICA DEL SISTEMA DE REGISTRO ===

      // Función para validar los datos del formulario
      function validateRegistration() {
        const name = playerNameInput.value.trim().toUpperCase();
        const age = parseInt(playerAgeInput.value);

        if (name.length !== 4) {
          alert('El nombre debe tener exactamente 4 letras');
          return false;
        }

        if (isNaN(age) || age < 1 || age > 120) {
          alert('La edad debe ser un número entre 1 y 120');
          return false;
        }

        return true;
      }

      // Función para completar el registro
      function completeRegistration() {
        if (validateRegistration()) {
          playerData.name = playerNameInput.value.trim().toUpperCase();
          playerData.age = parseInt(playerAgeInput.value);
          
          // Guardar en sessionStorage para acceso desde otras páginas (solo durante la sesión)
          sessionStorage.setItem('playerData', JSON.stringify(playerData));
          
          // Mostrar información del jugador
          playerNameDisplay.textContent = playerData.name;
          playerInfo.style.display = 'block';
                    
           if (registrationOverlay) {
            registrationOverlay.classList.add('hidden');
            console.log('Overlay ocultado');
          } else {
            console.error('No se pudo encontrar el overlay de registro');
          }
          
          playerRegistered = true;
          
          console.log('Jugador registrado:', playerData);
        }
      }

      // Event listeners para el formulario de registro
      startRegistrationButton.addEventListener('click', completeRegistration);

      // Permitir registro con Enter
      playerNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          playerAgeInput.focus();
        }
      });

      playerAgeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          completeRegistration();
        }
      });

      // Convertir automáticamente el nombre a mayúsculas
      playerNameInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase();
      });

      // Prevenir navegación al juego si no está registrado
      playButton.addEventListener('click', (e) => {
        if (!playerRegistered) {
          e.preventDefault();
          alert('Debes registrarte antes de jugar');
        }
      });

      // === VERIFICAR REGISTRO EN SESSIONSTORAGE ===
      
      // Verificar si hay datos de jugador en la sesión actual
      const savedPlayerData = sessionStorage.getItem('playerData');
      if (savedPlayerData) {
        try {
          const parsedData = JSON.parse(savedPlayerData);
          if (parsedData.name && parsedData.age) {
            playerData = parsedData;
            playerNameDisplay.textContent = playerData.name;
            playerInfo.style.display = 'block';
            registrationOverlay.classList.add('hidden');
            playerRegistered = true;
            console.log('Jugador cargado desde sessionStorage:', playerData);
          }
        } catch (error) {
          console.log('Error al cargar datos del jugador:', error);
          sessionStorage.removeItem('playerData');
        }
      } else {
        // Si no hay datos en sessionStorage, mostrar el registro
        registrationOverlay.classList.remove('hidden');
        playerInfo.style.display = 'none';
        console.log('No hay registro en la sesión - Usuario debe registrarse');
      }

      // Función global para obtener datos del jugador (accesible desde game.js)
      window.getPlayerData = function() {
        return playerData;
      };

      // Función global para verificar si el jugador está registrado
      window.isPlayerRegistered = function() {
        return playerRegistered;
      };

      // Función global para limpiar registro (útil para logout)
      window.clearPlayerRegistration = function() {
        sessionStorage.removeItem('playerData');
        playerRegistered = false;
        playerData = { name: '', age: 0 };
        playerInfo.style.display = 'none';
        registrationOverlay.classList.remove('hidden');
      };

    });
   </script>
</body>
</html>
